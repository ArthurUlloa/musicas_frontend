<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar música</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>

    <header>
        <p class="logo">Minhas <span>Músicas.</span></p>
        <a href="index.html">Voltar para a lista</a>
    </header>

    <main>
        <section class="conteudo">
            <p class="subtitulo">NOVA MÚSICA</p>
            <h1>Cadastrar música</h1>
            <p class="descricao">Adicione uma nova música à sua coleção.</p>

            <div class="campo">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Nome da música">
            </div>

            <div class="campo">
                <label for="artista">Artista</label>
                <input type="text" id="artista" placeholder="Nome do artista">
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" placeholder="Ex: Rock, Sertanejo, Pop">
            </div>

            <div class="campo">
                <label for="ano">Ano</label>
                <input type="number" id="ano" placeholder="Ex: 2024">
            </div>

            <div class="campo">
                <label for="duracao">Duração em minutos</label>
                <input type="number" id="duracao" placeholder="Ex: 5">
            </div>

            <button id="botaoCadastrar">Cadastrar</button>
        </section>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
